{% extends 'dashboard.html' %}

{% block content %}
<!-- Panggil CSS Profile hasil refactor agar terbaca sistem browser -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">

<div class="head-title">
    <div class="left">
        <h1>Pengaturan Akun</h1>
        <ul class="breadcrumb">
            <li><a href="#">Dashboard</a></li>
            <li><i class='bx bx-chevron-right'></i></li>
            <li><a class="active" href="#">Profile</a></li>
        </ul>
    </div>
</div>

<div class="table-data">
    <!-- KOTAK KIRI: MODERNISED AVATAR UPLOAD -->
    <div class="order profile-card-box">
        <div class="head" style="margin-bottom: 20px;">
            <h3>Foto Profil Admin</h3>
        </div>
        <div class="avatar-upload-wrapper">
            <div class="avatar-preview-holder">
                <img id="avatarPreview" src="{{ url_for('static', filename='img/avatars/' + user.profile_picture) if user.profile_picture else url_for('static', filename='img/avatar.png') }}" 
                     onerror="this.src='/static/img/avatar.png';" alt="Avatar Profil">
            </div>
            
            <form action="{{ url_for('web_dashboard.profile') }}" method="POST" enctype="multipart/form-data" style="width: 100%;">
                <input type="hidden" name="action" value="update_avatar">
                
                <div class="profile-file-box">
                    <input type="file" name="avatar" accept="image/*" id="avatarInput" onchange="previewAvatar(event)" required>
                    <div class="custom-file-label" id="fileLabelText">
                        <i class='bx bx-image-add' style="font-size: 18px;"></i>
                        <span>Pilih Foto Baru...</span>
                    </div>
                </div>
                
                <button type="submit" class="btn-profile-save btn-blue-solid">
                    <i class='bx bx-cloud-upload' style="font-size: 18px;"></i> Upload Foto Baru
                </button>
            </form>
        </div>
    </div>

    <!-- KOTAK KANAN: UNIFORM PASSWORD CONFIG -->
    <div class="todo profile-card-box">
        <div class="head" style="margin-bottom: 20px;">
            <h3>Ubah Password Keamanan</h3>
        </div>
        <form action="{{ url_for('web_dashboard.profile') }}" method="POST">
            <input type="hidden" name="action" value="update_password">
            
            <div class="profile-group">
                <label class="profile-label">Password Baru</label>
                <input type="password" name="new_password" class="profile-input" placeholder="Masukkan kata sandi baru..." required>
            </div>

            <div class="profile-group">
                <label class="profile-label">Konfirmasi Password Baru</label>
                <input type="password" name="confirm_password" class="profile-input" placeholder="Ulangi kata sandi baru..." required>
            </div>

            <button type="submit" class="btn-profile-save btn-orange-solid" style="margin-top: 14px;">
                <i class='bx bx-lock-open-alt' style="font-size: 18px;"></i> Simpan Password Baru
            </button>
        </form>
    </div>
</div>

<script>
    // Realtime JavaScript preview untuk file input avatar baru
    function previewAvatar(event) {
        const reader = new FileReader();
        reader.onload = function () {
            const output = document.getElementById('avatarPreview');
            output.src = reader.result;
            
            // Ubah teks box label kustom setelah berhasil load gambar
            document.getElementById('fileLabelText').querySelector('span').innerText = "Gambar siap diupload!";
            document.getElementById('fileLabelText').style.borderColor = "#3C91E6";
        };
        reader.readAsDataURL(event.target.files[0]);
    }
</script>
{% endblock %}
