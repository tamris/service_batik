<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.0.9/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/informasi.css') }}">
    <title>Tambah Artikel - AdminHub</title>
</head>

<body>
    <script>
        const theme = localStorage.getItem('theme');
        if (theme === 'dark') { document.body.classList.add('dark'); }
    </script>

    <section id="sidebar">
        <a href="#" class="brand"><i class='bx bxs-smile'></i><span class="text">AdminHub</span></a>
        <ul class="side-menu top">
            <li><a href="{{ url_for('web_dashboard.index') }}"><i class='bx bxs-dashboard'></i><span class="text">Dashboard</span></a></li>
            <li><a href="{{ url_for('galeri.index') }}"><i class='bx bxs-collection'></i><span class="text">Katalog Batik</span></a></li>
            <li class="active"><a href="{{ url_for('informasi.index') }}"><i class='bx bxs-info-circle'></i><span class="text">Konten Artikel</span></a></li>
            <li><a href="{{ url_for('event.index') }}"><i class='bx bxs-calendar'></i><span class="text">Event</span></a></li>
            <li><a href="{{ url_for('video.index') }}"><i class='bx bxs-video'></i><span class="text">Video</span></a></li>
            <li><a href="#"><i class='bx bxs-map'></i><span class="text">Mapping Lokasi</span></a></li>
            <li><a href="#"><i class='bx bxs-user'></i><span class="text">Users Manager</span></a></li>
            <li><a href="#"><i class='bx bxs-message-dots'></i><span class="text">Dataset Chatbot</span></a></li>
        </ul>
        <ul class="side-menu">
            <li><a href="#"><i class='bx bxs-cog'></i><span class="text">Settings</span></a></li>
            <li><a href="#" class="logout"><i class='bx bxs-log-out-circle'></i><span class="text">Logout</span></a></li>
        </ul>
    </section>

    <section id="content">
        <nav>
            <i class='bx bx-menu'></i>
            <a href="#" class="nav-link">Tambah Data Artikel</a>
            <div class="spacer" style="flex-grow: 1;"></div>
            <input type="checkbox" id="switch-mode" hidden>
            <label for="switch-mode" class="switch-mode"></label>
            <a href="#" class="notification"><i class='bx bxs-bell'></i><span class="num">8</span></a>
            <a href="#" class="profile"><img src="{{ url_for('static', filename='img/avatar.png') }}"></a>
        </nav>

        <main>
            <div class="head-title">
                <div class="left">
                    <h1>Tambah Artikel Baru</h1>
                </div>
            </div>

            <div class="table-data">
                <div class="order info-form-container">
                    <form action="{{ url_for('informasi.create') }}" method="POST" enctype="multipart/form-data">
                        
                        <div class="info-grid title-category-grid">
                            <div class="info-group">
                                <label class="info-label">Judul Konten</label>
                                <input type="text" name="judul" class="info-input" placeholder="Masukkan judul informasi..." required>
                            </div>
                            <div class="info-group">
                                <label class="info-label">Kategori</label>
                                <select name="kategori" class="info-input" required>
                                    <option value="" disabled selected>Pilih Kategori</option>
                                    <option value="Berita Terkini">Berita Terkini</option>
                                    <option value="Event">Event</option>
                                    <option value="Sosok & Inspirasi">Sosok & Inspirasi</option>
                                    <option value="Edukasi">Edukasi</option>
                                </select>
                            </div>
                        </div>

                        <div class="info-group">
                            <label class="info-label">Thumbnail Informasi</label>
                            <div class="file-upload-box">
                                <input type="file" name="gambar" accept="image/*" id="fileInput" onchange="previewImage(event)">
                                <div class="upload-content">
                                    <i class='bx bx-cloud-upload upload-icon'></i>
                                    <p id="uploadText">Klik atau seret file ke sini untuk memilih gambar thumbnail</p>
                                </div>
                            </div>
                            
                            <div class="preview-container" id="previewWrapper" style="display: none; margin-top: 15px;">
                                <span class="info-label" style="font-size:12px; margin-bottom:5px; color:#888;">Preview Gambar:</span>
                                <img id="imagePreview" src="#" alt="Preview">
                            </div>
                        </div>

                        <div class="info-group">
                            <label class="info-label">Isi Deskripsi / Artikel</label>
                            <textarea name="deskripsi" class="info-input" rows="8" placeholder="Tulis detail informasi di sini..." required></textarea>
                        </div>

                        <div class="info-actions">
                            <a href="{{ url_for('informasi.index') }}" class="btn-cancel">Batal</a>
                            <button type="submit" class="btn-save"><i class='bx bx-save'></i> Simpan Konten</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </section>

    <script>
        // Logika Dark Mode
        const switchMode = document.getElementById('switch-mode');
        if (localStorage.getItem('theme') === 'dark') {
            switchMode.checked = true;
        }
        switchMode.addEventListener('change', function () {
            if (this.checked) {
                document.body.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            } else {
                document.body.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            }
        });

        // Script Preview Gambar
        function previewImage(event) {
            var reader = new FileReader();
            reader.onload = function(){
                var output = document.getElementById('imagePreview');
                var wrapper = document.getElementById('previewWrapper');
                output.src = reader.result;
                wrapper.style.display = 'block';
                
                // Ubah teks upload setelah gambar dipilih
                document.getElementById('uploadText').innerText = "Gambar berhasil dipilih. Klik lagi untuk mengganti.";
            };
            reader.readAsDataURL(event.target.files[0]);
        }
    </script>
</body>
</html>
