<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.0.9/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/galeri.css') }}">
    <title>Tambah Batik - AdminBatik</title>
</head>

<body>
    <script>
        const theme = localStorage.getItem('theme');
        if (theme === 'dark') { document.body.classList.add('dark'); }
    </script>

    <section id="sidebar">
        <a href="#" class="brand"><i class='bx bxs-smile'></i><span class="text">AdminBatik</span></a>
        <ul class="side-menu top">
            <li><a href="{{ url_for('web_dashboard.index') }}"><i class='bx bxs-dashboard'></i><span
                        class="text">Dashboard</span></a></li>
            <li class="active"><a href="{{ url_for('galeri.index') }}"><i class='bx bxs-collection'></i><span
                        class="text">Katalog Batik</span></a></li>
            <li><a href="{{ url_for('informasi.index') }}"><i class='bx bxs-info-circle'></i><span class="text">Konten
                        Artikel</span></a></li>
            <li><a href="{{ url_for('event.index') }}"><i class='bx bxs-calendar'></i><span
                        class="text">Event</span></a></li>
            <li><a href="{{ url_for('video.index') }}"><i class='bx bxs-video'></i><span class="text">Video</span></a>
            </li>
            <li><a href="{{ url_for('mapping.index') }}"><i class='bx bxs-map'></i><span class="text">Peta Lokasi</span></a></li>
           {% if session.get('role') == 'superadmin' %}
			<li>
				<a href="{{ url_for('user_manager.index') }}">
					<i class='bx bxs-user'></i>
					<span class="text">Manajemen User</span>
				</a>
			</li>
			{% endif %}
          
        </ul>
        <ul class="side-menu">
         
            <li><a href="{{ url_for('auth.logout') }}" class="logout"><i class='bx bxs-log-out-circle'></i><span class="text">Keluar</span></a>
            </li>
        </ul>
    </section>

    <section id="content">
        <nav>
            <i class='bx bx-menu'></i>
            <a href="#" class="nav-link">Tambah Data Batik</a>
            <div class="spacer" style="flex-grow: 1;"></div>
            <input type="checkbox" id="switch-mode" hidden>
            <label for="switch-mode" class="switch-mode"></label>
            <a href="{{ url_for('web_dashboard.profile') }}" class="profile">
                <!-- Foto langsung membaca database secara global, otomatis update di semua halaman -->
                <img src="{{ url_for('static', filename='img/avatars/' + current_user_profile.profile_picture) if current_user_profile and current_user_profile.profile_picture else url_for('static', filename='img/avatar.png') }}" 
                     onerror="this.src='/static/img/avatar.png';">
            </a>
        </nav>

        <main>
            <div class="head-title">
                <div class="left">
                    <h1>Tambah Batik Baru</h1>
                </div>
            </div>

            <div class="table-data">
                <div class="order batik-form-container">
                    <form action="{{ url_for('galeri.create') }}" method="POST" enctype="multipart/form-data">
                        <input type="hidden" name="page" value="{{ request.args.get('page', 1) }}">

                        <div class="form-grid-upper">
                            <div class="batik-group">
                                <label class="batik-label">Nama Motif Batik</label>
                                <input type="text" name="name" class="batik-input"
                                    placeholder="Contoh: Batik Mega Mendung" required>
                            </div>

                            <div class="batik-group">
                                <label class="batik-label">Kategori Motif</label>
                                <select name="category" class="batik-input" required>
                                    <option value="" disabled selected>Pilih Kategori...</option>
                                    <option value="Klasik">Klasik</option>
                                    <option value="Kontemporer">Kontemporer</option>
                                    <option value="Bahari">Bahari</option>
                                    <option value="Flora & Fauna">Flora & Fauna</option>
                                </select>
                            </div>

                            <div class="batik-group">
                                <label class="batik-label">Teknik Pembuatan</label>
                                <select name="technique" class="batik-input" required>
                                    <option value="" disabled selected>Pilih Teknik Pembuatan...</option>
                                    <option value="Batik Tulis">Batik Tulis</option>
                                    <option value="Batik Cap">Batik Cap</option>
                                    <option value="Batik Kombinasi">Batik Kombinasi</option>
                                </select>
                            </div>

                            <div class="batik-group">
                                <label class="batik-label">Filosofi Batik</label>
                                <input type="text" name="philosophy" class="batik-input"
                                    placeholder="Contoh: Ketenangan, kepedulian, dan keharmonisan." required>
                            </div>
                        </div>

                        <div class="form-row-media-full">
                            <div class="batik-group">
                                <label class="batik-label">Gambar Motif Batik</label>
                                <div class="file-upload-box">
                                    <input type="file" name="image_url" accept="image/*" id="fileInput"
                                        onchange="previewImage(event)" required>
                                    <div class="upload-content">
                                        <i class='bx bx-cloud-upload upload-icon'></i>
                                        <p id="uploadText">Klik/seret gambar batik ke sini</p>
                                    </div>
                                </div>
                            </div>

                            <div class="preview-container" id="previewContainer"
                                style="display: none; margin-bottom: 24px;">
                                <label class="batik-label">Preview Motif Batik:</label>
                                <div class="image-preview-wrapper-full">
                                    <img id="imagePreview" src="#" alt="Preview Motif">
                                </div>
                            </div>

                            <div class="sketch-toggle-container" style="margin-bottom: 24px;">
                                <label class="checkbox-premium-label">
                                    <input type="checkbox" name="activate_sketch" value="true">
                                    <span class="checkbox-custom"></span>
                                    <div class="checkbox-text">
                                        <span class="title">Aktifkan Fitur Simulasi Membatik</span>
                                        <span class="desc">Buat file sketsa otomatis via OpenCV jika motif ini
                                            berkategori mudah/sedang untuk aplikasi Flutter.</span>
                                    </div>
                                </label>
                            </div>

                            <div class="form-grid-narration-split">
                                <div class="batik-group">
                                    <label class="batik-label">Makna Batik</label>
                                    <textarea name="makna" class="batik-input" style="height: 160px; resize: none;"
                                        placeholder="Tuliskan makna motif secara mendalam..." required></textarea>
                                </div>

                                <div class="batik-group">
                                    <label class="batik-label">Sejarah Batik</label>
                                    <textarea name="history" class="batik-input" style="height: 160px; resize: none;"
                                        placeholder="Tuliskan asal-usul/sejarah singkat motif batik di masyarakat lokal..."
                                        required></textarea>
                                </div>
                            </div>

                            <div class="form-row-color-picker-safe">
                                <div class="batik-group">
                                    <label class="batik-label">Warna Dominan Batik (Maks. 4 Warna) — *Gunakan pipet
                                        warna
                                        pada gambar preview di atas</label>
                                    <div class="color-picker-container">
                                        <input type="color" name="dominant_color_1" class="batik-color-picker"
                                            value="#8B5A2B">
                                        <input type="color" name="dominant_color_2" class="batik-color-picker"
                                            value="#CD853F">
                                        <input type="color" name="dominant_color_3" class="batik-color-picker"
                                            value="#F5F5DC">
                                        <input type="color" name="dominant_color_4" class="batik-color-picker"
                                            value="#2B1B10">
                                    </div>
                                </div>
                            </div>

                            <div class="batik-actions">
                                <a href="{{ url_for('galeri.index') }}" class="btn-cancel">Batal</a>
                                <button type="submit" class="btn-save"><i class='bx bx-save'></i> Simpan Batik</button>
                            </div>
                    </form>
                </div>
            </div>
        </main>
    </section>

    <script>
        // Logika Dark Mode
        const switchMode = document.getElementById('switch-mode');
        if (localStorage.getItem('theme') === 'dark') {
            switchMode.checked = true;
        }
        switchMode.addEventListener('change', function () {
            if (this.checked) {
                document.body.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            } else {
                document.body.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            }
        });

        // Script Preview Gambar Upload
        function previewImage(event) {
            var reader = new FileReader();
            reader.onload = function () {
                var output = document.getElementById('imagePreview');
                var container = document.getElementById('previewContainer');
                output.src = reader.result;
                container.style.display = 'block';

                document.getElementById('uploadText').innerText = "Gambar motif berhasil dipilih. Klik lagi untuk mengganti.";
            };
            reader.readAsDataURL(event.target.files[0]);
        }
    </script>
</body>

</html>
