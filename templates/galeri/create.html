<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.0.9/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/galeri.css') }}">
    <title>Tambah Batik - AdminHub</title>
</head>

<body>
    <script>
        const theme = localStorage.getItem('theme');
        if (theme === 'dark') { document.body.classList.add('dark'); }
    </script>

    <section id="sidebar">
        <a href="#" class="brand"><i class='bx bxs-smile'></i><span class="text">AdminHub</span></a>
        <ul class="side-menu top">
            <li><a href="{{ url_for('web_dashboard.index') }}"><i class='bx bxs-dashboard'></i><span
                        class="text">Dashboard</span></a></li>
            <li class="active"><a href="{{ url_for('galeri.index') }}"><i class='bx bxs-collection'></i><span
                        class="text">Katalog Batik</span></a></li>
            <li><a href="{{ url_for('informasi.index') }}"><i class='bx bxs-info-circle'></i><span class="text">Konten
                        Artikel</span></a></li>
            <li><a href="{{ url_for('event.index') }}"><i class='bx bxs-calendar'></i><span
                        class="text">Event</span></a></li>
            <li><a href="{{ url_for('video.index') }}"><i class='bx bxs-video'></i><span class="text">Video</span></a>
            </li>
            <li><a href="#"><i class='bx bxs-map'></i><span class="text">Mapping Lokasi</span></a></li>
            <li><a href="#"><i class='bx bxs-user'></i><span class="text">Users Manager</span></a></li>
            <li><a href="#"><i class='bx bxs-message-dots'></i><span class="text">Dataset Chatbot</span></a></li>
        </ul>
        <ul class="side-menu">
            <li><a href="#"><i class='bx bxs-cog'></i><span class="text">Settings</span></a></li>
            <li><a href="#" class="logout"><i class='bx bxs-log-out-circle'></i><span class="text">Logout</span></a>
            </li>
        </ul>
    </section>

    <section id="content">
        <nav>
            <i class='bx bx-menu'></i>
            <a href="#" class="nav-link">Tambah Data Batik</a>
            <div class="spacer" style="flex-grow: 1;"></div>
            <input type="checkbox" id="switch-mode" hidden>
            <label for="switch-mode" class="switch-mode"></label>
            <a href="#" class="notification"><i class='bx bxs-bell'></i><span class="num">8</span></a>
            <a href="#" class="profile"><img src="{{ url_for('static', filename='img/avatar.png') }}"></a>
        </nav>

        <main>
            <div class="head-title">
                <div class="left">
                    <h1>Tambah Batik Baru</h1>
                </div>
            </div>

            <div class="table-data">
                <div class="order batik-form-container">
                    <form action="{{ url_for('galeri.create') }}" method="POST" enctype="multipart/form-data">

                        <div class="form-row-split">

                            <div class="form-col">
                                <div class="batik-group">
                                    <label class="batik-label">Nama Motif Batik</label>
                                    <input type="text" name="name" class="batik-input"
                                        placeholder="Contoh: Batik Mega Mendung" required>
                                </div>

                                <div class="batik-group">
                                    <label class="batik-label">Kategori Motif</label>
                                    <select name="category" class="batik-input" required>
                                        <option value="" disabled selected>Pilih Kategori...</option>
                                        <option value="Klasik">Klasik</option>
                                        <option value="Kontemporer">Kontemporer</option>
                                        <option value="Bahari">Bahari</option>
                                        <option value="Flora & Fauna">Flora & Fauna</option>
                                    </select>
                                </div>

                                <div class="batik-group">
                                    <label class="batik-label">Teknik Pembuatan</label>
                                    <select name="technique" class="batik-input" required>
                                        <option value="" disabled selected>Pilih Teknik Pembuatan...</option>
                                        <option value="Batik Tulis">Batik Tulis</option>
                                        <option value="Batik Cap">Batik Cap</option>
                                        <option value="Batik Kombinasi">Batik Kombinasi</option>
                                    </select>
                                </div>

                                <div class="batik-group">
                                    <label class="batik-label">Warna Dominan (Maks. 4 Warna)</label>
                                    <div style="display: flex; gap: 12px; align-items: center; margin-top: 5px;">
                                        <input type="color" name="dominant_color_1" class="batik-color-picker"
                                            value="#8B5A2B">
                                        <input type="color" name="dominant_color_2" class="batik-color-picker"
                                            value="#CD853F">
                                        <input type="color" name="dominant_color_3" class="batik-color-picker"
                                            value="#F5F5DC">
                                        <input type="color" name="dominant_color_4" class="batik-color-picker"
                                            value="#2B1B10">
                                    </div>
                                </div>
                            </div>

                            <div class="form-col">
                                <div class="batik-group">
                                    <label class="batik-label">Gambar Motif Batik</label>
                                    <div class="file-upload-box" style="padding: 25px 20px;">
                                        <input type="file" name="image_url" accept="image/*" id="fileInput"
                                            onchange="previewImage(event)" required>
                                        <div class="upload-content">
                                            <i class='bx bx-cloud-upload upload-icon' style="font-size: 32px;"></i>
                                            <p id="uploadText" style="font-size: 13px;">Klik/seret gambar batik ke sini
                                            </p>
                                        </div>
                                    </div>

                                    <div class="preview-container" id="previewContainer"
                                        style="display: none; margin-top: 12px; text-align: left;">
                                        <span class="batik-label"
                                            style="font-size:12px; margin-bottom:5px; color:#888; display: block;">Preview
                                            Gambar:</span>
                                        <img id="imagePreview" src="#" alt="Preview Motif"
                                            style="max-width: 140px; height: auto; border-radius: 6px;">
                                    </div>
                                </div>
                            </div>

                        </div>

                        <div class="form-row-triple" style="margin-top: 15px;">
                            <div class="form-col">
                                <div class="batik-group">
                                    <label class="batik-label">Makna Batik</label>
                                    <textarea name="makna" class="batik-input" rows="4"
                                        placeholder="Tuliskan makna motif..." required></textarea>
                                </div>
                            </div>
                            <div class="form-col">
                                <div class="batik-group">
                                    <label class="batik-label">Filosofi Batik</label>
                                    <textarea name="philosophy" class="batik-input" rows="4"
                                        placeholder="Tuliskan filosofi mendalam..." required></textarea>
                                </div>
                            </div>
                            <div class="form-col">
                                <div class="batik-group">
                                    <label class="batik-label">Sejarah Batik</label>
                                    <textarea name="history" class="batik-input" rows="4"
                                        placeholder="Tuliskan asal-usul/sejarah singkat..." required></textarea>
                                </div>
                            </div>
                        </div>

                        <div class="batik-actions" style="margin-top: 20px;">
                            <a href="{{ url_for('galeri.index') }}" class="btn-cancel">Batal</a>
                            <button type="submit" class="btn-save"><i class='bx bx-save'></i> Simpan Batik</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </section>

    <script>
        // Logika Dark Mode
        const switchMode = document.getElementById('switch-mode');
        if (localStorage.getItem('theme') === 'dark') {
            switchMode.checked = true;
        }
        switchMode.addEventListener('change', function () {
            if (this.checked) {
                document.body.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            } else {
                document.body.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            }
        });

        // Script Preview Gambar Upload
        function previewImage(event) {
            var reader = new FileReader();
            reader.onload = function () {
                var output = document.getElementById('imagePreview');
                var container = document.getElementById('previewContainer');
                output.src = reader.result;
                container.style.display = 'block';

                document.getElementById('uploadText').innerText = "Gambar motif berhasil dipilih. Klik lagi untuk mengganti.";
            };
            reader.readAsDataURL(event.target.files[0]);
        }
    </script>
</body>

</html>
